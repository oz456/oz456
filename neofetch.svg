<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <style>
    .window { fill: #11111b; rx: 10px; }
    .topbar { fill: #1e1e2e; }
    .btn-red { fill: #f38ba8; }
    .btn-yel { fill: #f9e2af; }
    .btn-grn { fill: #a6e3a1; }
    
    .text { font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace; font-size: 14px; }
    .ascii { font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace; font-size: 14px; font-weight: bold; fill: #89b4fa; }
    
    .user { fill: #89b4fa; font-weight: bold; }
    .at { fill: #cdd6f4; }
    .host { fill: #89b4fa; font-weight: bold; }
    .sep { fill: #cdd6f4; }
    
    .key { fill: #f9e2af; font-weight: bold; }
    .val { fill: #cdd6f4; }
    
    .cursor { fill: #cdd6f4; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 
      0%, 100% { transform: translateY(0px); } 
      50% { transform: translateY(-8px); } 
    }
  </style>
  
  <g class="float">
    <!-- Window Background -->
    <rect class="window" width="600" height="350" x="0" y="0"/>
    
    <!-- Topbar -->
    <rect class="topbar" width="600" height="30" rx="10" x="0" y="0"/>
    <rect class="topbar" width="600" height="15" x="0" y="15"/>
    <circle class="btn-red" cx="20" cy="15" r="6"/>
    <circle class="btn-yel" cx="40" cy="15" r="6"/>
    <circle class="btn-grn" cx="60" cy="15" r="6"/>
    
    <!-- Arch Linux ASCII Art -->
    <text class="ascii" x="40" y="90">
      <tspan x="40" dy="1.2em">       /\       </tspan>
      <tspan x="40" dy="1.2em">      /  \      </tspan>
      <tspan x="40" dy="1.2em">     /\   \     </tspan>
      <tspan x="40" dy="1.2em">    /      \    </tspan>
      <tspan x="40" dy="1.2em">   /   ,,   \   </tspan>
      <tspan x="40" dy="1.2em">  /   |  |   \  </tspan>
      <tspan x="40" dy="1.2em"> /_-''    ''-_\ </tspan>
    </text>
    
    <!-- System Info -->
    <g class="text" transform="translate(220, 85)">
      <text>
        <tspan class="user">oz456</tspan><tspan class="at">@</tspan><tspan class="host">github</tspan>
      </text>
      <text y="20" class="sep">----------------</text>
      
      <text y="45"><tspan class="key">OS</tspan><tspan class="val">: Arch Linux x86_64</tspan></text>
      <text y="65"><tspan class="key">Kernel</tspan><tspan class="val">: 6.1.41-1-lts</tspan></text>
      <text y="85"><tspan class="key">Uptime</tspan><tspan class="val">: 24/7</tspan></text>
      <text y="105"><tspan class="key">Shell</tspan><tspan class="val">: bash 5.1.16</tspan></text>
      <text y="125"><tspan class="key">Theme</tspan><tspan class="val">: Catppuccin Mocha</tspan></text>
      <text y="145"><tspan class="key">Vibe</tspan><tspan class="val">: Shinchan &amp; Carefree</tspan></text>
      <text y="165"><tspan class="key">Status</tspan><tspan class="val">: "I'll be good tomorrow!"</tspan></text>
      
      <!-- Color blocks -->
      <g transform="translate(0, 195)">
         <rect fill="#45475a" width="15" height="15" x="0"/>
         <rect fill="#f38ba8" width="15" height="15" x="15"/>
         <rect fill="#a6e3a1" width="15" height="15" x="30"/>
         <rect fill="#f9e2af" width="15" height="15" x="45"/>
         <rect fill="#89b4fa" width="15" height="15" x="60"/>
         <rect fill="#f5c2e7" width="15" height="15" x="75"/>
         <rect fill="#94e2d5" width="15" height="15" x="90"/>
         <rect fill="#cdd6f4" width="15" height="15" x="105"/>
      </g>
    </g>
    
    <!-- Bottom Prompt -->
    <text class="text" x="40" y="310">
       <tspan class="user">oz456</tspan><tspan class="at">@</tspan><tspan class="host">github</tspan><tspan class="sep"> ~$ </tspan><tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>
